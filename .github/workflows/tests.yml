name: unit-tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run fast control and noise tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          candidates = [
              Path("tests/test_control_objective.py"),
              Path("tests/test_fourier_pulse.py"),
              Path("tests/test_config.py"),
              Path("tests/test_ou_dephasing.py"),
          ]
          tests = [str(path) for path in candidates if path.exists()]
          if not tests:
              raise SystemExit("No fast tests found")
          raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", "-q", *tests]))
          PY
